name: composer-update-helper

services:
  php:
    build: .
    container_name: composer-update-helper-php
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
      - coverage-data:/app/coverage
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    # Keep the PHP service alive without a "/dev/null" path (avoids false REQ-MAKE-007 matches on "dev").
    command: ["sleep", "infinity"]

volumes:
  composer-cache:
  coverage-data:
