name: composer-update-helper

services:
  php:
    build: .
    container_name: composer-update-helper-php
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
      - coverage-data:/app/coverage
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    command: ["tail", "-f", "/dev/null"]

volumes:
  composer-cache:
  coverage-data:
